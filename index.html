<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D GLB Face Tracking - MediaPipe Tasks</title>
    
    <!-- CSS Personnalisé -->
    <link rel="stylesheet" href="style.css">

    <!-- Librairies 3D (Three.js & GLTFLoader) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <!-- SDK MediaPipe Tasks Vision Web -->
    <script type="module">
        import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
        window.FaceLandmarker = FaceLandmarker;
        window.FilesetResolver = FilesetResolver;
    </script>
</head>
<body>

    <!-- Interface utilisateur -->
    <div class="ui-panel">
        <h2>Face Animator (.glb)</h2>
        <p id="loading-info">Chargement des modèles...</p>
        <button id="startBtn" class="btn" style="margin-top: 10px;" disabled>Lancer la caméra</button>
    </div>

    <!-- Conteneur Rendu 3D -->
    <div id="canvas-container"></div>

    <!-- Flux Webcam -->
    <video id="webcam" autoplay playsinline></video>

    <!-- Script JavaScript Principal -->
    <script src="app.js"></script>
</body>
</html>
